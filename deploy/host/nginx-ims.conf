# nginx site for the production IMS host (installed by deploy/bin/host-bootstrap.sh as /etc/nginx/sites-available/ims).
#
# Listens on :3000; the OpenLiteSpeed vhost ims.onetwo3d.co.uk proxies to this port and is never touched by a deploy. The ACTIVE app
# slot is named in /etc/nginx/ims-upstream.conf, which deploy.sh and rollback.sh rewrite atomically before a graceful reload.
# Until the first release is deployed (or while no slot answers) the holding page is served with a 503.

# Defines `upstream ims_active { server 127.0.0.1:<slot port>; }` and `map ... $ims_slot` (blue, green or none). The site returns
# the slot as the X-IMS-Slot response header, so deploy.sh and rollback.sh can ask the RUNNING nginx which slot it serves from
# (the upstream file alone cannot say: a switch can be interrupted between the file write and the reload). It also defines
# $ims_maint (0/1) for the maintenance response.
include /etc/nginx/ims-upstream.conf;

server {
    listen 3000 default_server;
    server_name _;

    client_max_body_size 64m;
    add_header X-IMS-Slot $ims_slot always;

    location / {
        # Maintenance (a contract-migration deploy): the upstream include sets $ims_maint; answer 503 + Retry-After via the holding page.
        if ($ims_maint) { return 503; }
        proxy_pass http://ims_active;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # TLS ends at OpenLiteSpeed; pass its scheme through.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        # The cron routes (reconciliation pack, backup) run for minutes.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        # Never replay a request on another upstream.
        proxy_next_upstream off;
        proxy_intercept_errors on;
        error_page 502 503 504 =503 /__ims_holding.html;
    }

    location = /__ims_holding.html {
        internal;
        root /srv/ims/holding;
        add_header Retry-After 30 always;
        add_header X-IMS-Slot $ims_slot always;
    }
}
