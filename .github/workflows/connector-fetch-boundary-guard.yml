name: Connector Fetch Boundary Guard

on:
  pull_request:
    paths:
      - ".github/workflows/connector-fetch-boundary-guard.yml"
      - "app/actions/**"
      - "app/api/cron/**"
      - "lib/connectors/**"
      - "lib/shopping.ts"
      - "package-lock.json"
      - "package.json"
      - "scripts/check-connector-fetch-boundaries.mjs"
      - "tests/scripts/connector-fetch-boundaries.test.ts"
  push:
    branches:
      - development
    paths:
      - ".github/workflows/connector-fetch-boundary-guard.yml"
      - "app/actions/**"
      - "app/api/cron/**"
      - "lib/connectors/**"
      - "lib/shopping.ts"
      - "package-lock.json"
      - "package.json"
      - "scripts/check-connector-fetch-boundaries.mjs"
      - "tests/scripts/connector-fetch-boundaries.test.ts"

jobs:
  connector-fetch-boundary-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm run check:connector-fetch-boundaries
