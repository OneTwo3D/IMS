name: WMS Connector Boundary Guard

on:
  pull_request:
    paths:
      - ".github/workflows/wms-connector-boundary-guard.yml"
      - "app/**"
      - "components/**"
      - "lib/**"
      - "package-lock.json"
      - "package.json"
      - "scripts/check-wms-connector-boundary.mjs"
  push:
    branches:
      - development
    paths:
      - ".github/workflows/wms-connector-boundary-guard.yml"
      - "app/**"
      - "components/**"
      - "lib/**"
      - "package-lock.json"
      - "package.json"
      - "scripts/check-wms-connector-boundary.mjs"

jobs:
  wms-connector-boundary-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm run check:wms-connector-boundary
