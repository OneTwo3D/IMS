name: Schema Guardrails

on:
  pull_request:
    paths:
      - ".github/workflows/schema-guardrails.yml"
      - ".github/pull_request_template.md"
      - "docs/development.md"
      - "package.json"
      - "prisma/**"
      - "scripts/validate-db.sh"
      - "scripts/check-prisma-drift.mjs"
      - "scripts/check-prisma-schema-scope.mjs"
      - "tests/concurrency/**"
      - "scripts/deploy.sh"
      - "scripts/install.sh"
      - "scripts/update.sh"
      - "scripts/check-db-writers.mjs"
      - "scripts/fence-db-connections.mjs"
      - "scripts/run-migration-verifications.mjs"
      - "scripts/check-app-db-object-access.mjs"
  push:
    branches:
      - main
      - development
    paths:
      - ".github/workflows/schema-guardrails.yml"
      - "docs/development.md"
      - "package.json"
      - "prisma/**"
      - "scripts/validate-db.sh"
      - "scripts/check-prisma-drift.mjs"
      - "scripts/check-prisma-schema-scope.mjs"
      - "tests/concurrency/**"
      - "scripts/deploy.sh"
      - "scripts/install.sh"
      - "scripts/update.sh"
      - "scripts/check-db-writers.mjs"
      - "scripts/fence-db-connections.mjs"
      - "scripts/run-migration-verifications.mjs"
      - "scripts/check-app-db-object-access.mjs"

jobs:
  migration-scope:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Verify migration/schema parity in the PR diff
        run: node scripts/check-prisma-schema-scope.mjs "origin/${{ github.base_ref }}" HEAD

  fresh-db-drift:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ims_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ims_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ims_ci?schema=public
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate --schema prisma/schema.prisma
      - run: npx prisma migrate deploy --schema prisma/schema.prisma
      - name: Verify deployed database matches prisma/schema.prisma
        run: node scripts/check-prisma-drift.mjs
      # The same hook scripts/deploy.sh runs between the migration and the start of
      # the new build (o3d-2sm1.1). Running it here means a migration's declared
      # verification queries are exercised against a real migrated database on every
      # PR, instead of first being executed during a production cutover.
      #
      # --strict additionally FAILS when a migration named in
      # prisma/migrations/verification-required.txt declares no verify.sql. The deploy
      # scripts run the same hook without it: a missing file in the repository is a
      # defect for the PR to fix, not a reason to refuse to start a built and migrated
      # application. Until o3d-2sm1.2 this hook exited 0 having executed nothing at all.
      - name: Run the migrations' post-migration verification checks
        run: node scripts/run-migration-verifications.mjs --strict
      # The check that closes o3d-2sm1.5, exercised against a REAL migrated database rather
      # than only against its own source text. `has_table_privilege(role, oid, 'SELECT,
      # INSERT, UPDATE, DELETE')` is ANY and not ALL, so a comma-separated list answers TRUE
      # for a read-only grant — a green check over a database the application cannot write.
      # The test creates a role with SELECT and nothing else and requires the check to fail.
      - name: Prove the application role can use what a migration creates
        env:
          RUN_DB_OBJECT_ACCESS_TEST: "1"
        run: npx tsx --test --experimental-test-module-mocks tests/scripts/app-db-object-access.test.ts
      # THE SESSION-LOCK GUARD NEEDS A ROUTE THAT IS NOT BEHIND DOCKER'S PORT NAT (o3d-2k5r).
      #
      # `services:` publishes the container's 5432 on the runner, and a connection to
      # 127.0.0.1:5432 is carried by docker-proxy: it TERMINATES our socket and opens its own to
      # the container. The backend then names its client as 172.18.0.1:<proxy's port> while this
      # process's own socket is 127.0.0.1:<our port>, and `pgSessionLockConnectionConfig()`
      # refuses -- a peer that is not ours is the same evidence a transaction-pooling proxy
      # presents, and the module cannot tell the two apart from SQL or from Node, so it refuses
      # both rather than trust a socket that may be re-pointed. That is this repository's own
      # documented false positive on a NAT, and it landed on this repository's own pipeline: the
      # payment-write lock regression failed here on every run.
      #
      # THE FIX IS THE ONE THE REFUSAL PRESCRIBES, and it is not to weaken the check. The service
      # container's OWN bridge address is a direct route: host-to-container traffic leaves via the
      # bridge interface and Docker's MASQUERADE rule excludes it (`! -o <bridge>`), so the
      # backend sees 172.18.0.1:<our own port> -- our socket, byte for byte -- and the peer
      # comparison passes. It is the same PostgreSQL as DATABASE_URL, so the override's
      # shared-lock-space probe (an advisory lock taken over here must block a witness over there)
      # passes too. DATABASE_URL stays on the published port, which is what the override is FOR:
      # ordinary query traffic keeps its route, only the advisory-lock pools take the direct one.
      #
      # Verified before it was written, against a stand-in for the NAT: a plain TCP relay in front
      # of a local PostgreSQL reproduces the refusal verbatim ("something between the two
      # terminated the connection"), and adding DATABASE_SESSION_LOCK_URL for the same database on
      # the direct port turns all 32 concurrency tests green.
      - name: Resolve the postgres service's direct, non-NAT address
        id: direct-db
        run: |
          ip="$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' '${{ job.services.postgres.id }}')"
          if [ -z "$ip" ]; then
            echo "could not read the postgres service container's bridge address" >&2
            exit 1
          fi
          if ! timeout 10 bash -c "until </dev/tcp/${ip}/5432; do sleep 1; done" 2>/dev/null; then
            echo "the postgres service container is not reachable at ${ip}:5432" >&2
            exit 1
          fi
          echo "url=${DATABASE_URL/@127.0.0.1:5432/@${ip}:5432}" >> "$GITHUB_OUTPUT"
      - name: Run DB-backed concurrency regressions
        env:
          # Scoped to THIS step on purpose. It must not reach a step that re-points DATABASE_URL at
          # another database -- an override naming a different database is refused outright, by
          # design, so a job-wide value would break such a step rather than help it.
          DATABASE_SESSION_LOCK_URL: ${{ steps.direct-db.outputs.url }}
        run: npm run test:concurrency
