name: Schema Guardrails

on:
  pull_request:
    paths:
      - ".github/workflows/schema-guardrails.yml"
      - ".github/pull_request_template.md"
      - "docs/development.md"
      - "package.json"
      - "prisma/**"
      - "scripts/validate-db.sh"
      - "scripts/check-prisma-drift.mjs"
      - "scripts/check-prisma-schema-scope.mjs"
      - "tests/concurrency/**"
      - "scripts/deploy.sh"
      - "scripts/install.sh"
      - "scripts/update.sh"
      - "scripts/check-db-writers.mjs"
      - "scripts/fence-db-connections.mjs"
      - "scripts/run-migration-verifications.mjs"
      - "scripts/check-app-db-object-access.mjs"
      - "scripts/check-db-test-gates.mjs"
      - "scripts/db-test-gate-allowlist.json"
      - "tests/db/**"
      - "lib/db/**"
      - "lib/domain/accounting/**"
      # The two modules that BUILD the shopping-inbox compaction predicate, which
      # tests/db/shopping-webhook-retention-evidence.test.ts executes against a real Postgres. Without
      # them a change to the predicate could not reach the only job that runs that evidence.
      - "lib/connectors/shopping-webhook-retention.ts"
      - "lib/connectors/shopping-webhook-inbox.ts"
  push:
    branches:
      - main
      - development
    paths:
      - ".github/workflows/schema-guardrails.yml"
      - "docs/development.md"
      - "package.json"
      - "prisma/**"
      - "scripts/validate-db.sh"
      - "scripts/check-prisma-drift.mjs"
      - "scripts/check-prisma-schema-scope.mjs"
      - "tests/concurrency/**"
      - "scripts/deploy.sh"
      - "scripts/install.sh"
      - "scripts/update.sh"
      - "scripts/check-db-writers.mjs"
      - "scripts/fence-db-connections.mjs"
      - "scripts/run-migration-verifications.mjs"
      - "scripts/check-app-db-object-access.mjs"
      - "scripts/check-db-test-gates.mjs"
      - "scripts/db-test-gate-allowlist.json"
      - "tests/db/**"
      - "lib/db/**"
      - "lib/domain/accounting/**"
      # The two modules that BUILD the shopping-inbox compaction predicate, which
      # tests/db/shopping-webhook-retention-evidence.test.ts executes against a real Postgres. Without
      # them a change to the predicate could not reach the only job that runs that evidence.
      - "lib/connectors/shopping-webhook-retention.ts"
      - "lib/connectors/shopping-webhook-inbox.ts"

jobs:
  migration-scope:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Verify migration/schema parity in the PR diff
        run: node scripts/check-prisma-schema-scope.mjs "origin/${{ github.base_ref }}" HEAD

  fresh-db-drift:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ims_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ims_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ims_ci?schema=public
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate --schema prisma/schema.prisma
      - run: npx prisma migrate deploy --schema prisma/schema.prisma
      - name: Verify deployed database matches prisma/schema.prisma
        run: node scripts/check-prisma-drift.mjs
      # The same hook scripts/deploy.sh runs between the migration and the start of
      # the new build (o3d-2sm1.1). Running it here means a migration's declared
      # verification queries are exercised against a real migrated database on every
      # PR, instead of first being executed during a production cutover.
      #
      # --strict additionally FAILS when a migration named in
      # prisma/migrations/verification-required.txt declares no verify.sql. The deploy
      # scripts run the same hook without it: a missing file in the repository is a
      # defect for the PR to fix, not a reason to refuse to start a built and migrated
      # application. Until o3d-2sm1.2 this hook exited 0 having executed nothing at all.
      - name: Run the migrations' post-migration verification checks
        run: node scripts/run-migration-verifications.mjs --strict
      # The check that closes o3d-2sm1.5, exercised against a REAL migrated database rather
      # than only against its own source text. `has_table_privilege(role, oid, 'SELECT,
      # INSERT, UPDATE, DELETE')` is ANY and not ALL, so a comma-separated list answers TRUE
      # for a read-only grant — a green check over a database the application cannot write.
      # The test creates a role with SELECT and nothing else and requires the check to fail.
      - name: Prove the application role can use what a migration creates
        env:
          RUN_DB_OBJECT_ACCESS_TEST: "1"
        run: npx tsx --test --experimental-test-module-mocks tests/scripts/app-db-object-access.test.ts
      # THE SESSION-LOCK GUARD NEEDS A ROUTE THAT IS NOT BEHIND DOCKER'S PORT NAT (o3d-2k5r).
      #
      # `services:` publishes the container's 5432 on the runner, and a connection to
      # 127.0.0.1:5432 is carried by docker-proxy: it TERMINATES our socket and opens its own to
      # the container. The backend then names its client as 172.18.0.1:<proxy's port> while this
      # process's own socket is 127.0.0.1:<our port>, and `pgSessionLockConnectionConfig()`
      # refuses -- a peer that is not ours is the same evidence a transaction-pooling proxy
      # presents, and the module cannot tell the two apart from SQL or from Node, so it refuses
      # both rather than trust a socket that may be re-pointed. That is this repository's own
      # documented false positive on a NAT, and it landed on this repository's own pipeline: the
      # payment-write lock regression failed here on every run.
      #
      # THE FIX IS THE ONE THE REFUSAL PRESCRIBES, and it is not to weaken the check. The service
      # container's OWN bridge address is a direct route: host-to-container traffic leaves via the
      # bridge interface and Docker's MASQUERADE rule excludes it (`! -o <bridge>`), so the
      # backend sees 172.18.0.1:<our own port> -- our socket, byte for byte -- and the peer
      # comparison passes. It is the same PostgreSQL as DATABASE_URL, so the override's
      # shared-lock-space probe (an advisory lock taken over here must block a witness over there)
      # passes too. DATABASE_URL stays on the published port, which is what the override is FOR:
      # ordinary query traffic keeps its route, only the advisory-lock pools take the direct one.
      #
      # Verified before it was written, against a stand-in for the NAT: a plain TCP relay in front
      # of a local PostgreSQL reproduces the refusal verbatim ("something between the two
      # terminated the connection"), and adding DATABASE_SESSION_LOCK_URL for the same database on
      # the direct port turns all 32 concurrency tests green.
      - name: Resolve the postgres service's direct, non-NAT address
        id: direct-db
        run: |
          ip="$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' '${{ job.services.postgres.id }}')"
          if [ -z "$ip" ]; then
            echo "could not read the postgres service container's bridge address" >&2
            exit 1
          fi
          if ! timeout 10 bash -c "until </dev/tcp/${ip}/5432; do sleep 1; done" 2>/dev/null; then
            echo "the postgres service container is not reachable at ${ip}:5432" >&2
            exit 1
          fi
          echo "url=${DATABASE_URL/@127.0.0.1:5432/@${ip}:5432}" >> "$GITHUB_OUTPUT"
      - name: Run DB-backed concurrency regressions
        env:
          # Scoped to THIS step on purpose. It must not reach a step that re-points DATABASE_URL at
          # another database -- an override naming a different database is refused outright, by
          # design, so a job-wide value would break such a step rather than help it.
          DATABASE_SESSION_LOCK_URL: ${{ steps.direct-db.outputs.url }}
        run: npm run test:concurrency

  # ===========================================================================================
  # THE DB-BACKED REGRESSION SUITES, WHICH UNTIL o3d-11rf r13 RAN NOWHERE (Codex r13, HIGH)
  # ===========================================================================================
  # WHAT WAS WRONG. `tests/db/reconciliation-void-mirror-contradictions.test.ts` and
  # `tests/db/accounting-event-void-basis-backfill.test.ts` gate every test on
  # `RUN_DB_MIGRATION_TESTS === '1'`, and NO checked-in workflow set it. `npm run test:unit`'s glob
  # (`tests/**/*.test.ts`) collects both files on every CI run, so they reported as skipped tests
  # inside a green suite and nothing anywhere said that the branch's central evidence — the
  # ownership join, the truncation containment, the fold parity, the Turkish locale — had not been
  # executed.
  #
  # AND THEN IT WAS WRONG AGAIN, THE SAME WAY, FOR A DIFFERENT GATE (Codex r18, HIGH). An earlier
  # revision of this comment said the OTHER nine files in tests/db/ were static source scanners. They
  # are not, and the sentence hid the defect it was next to:
  #
  #   * THREE files gate on a `RUN_DB_*` variable — the two above, and
  #     `shopping-webhook-retention-evidence.test.ts`, which gates on `RUN_DB_RETENTION_TESTS`. That
  #     third variable was set NOWHERE, including by `test:db`, so its one test — the only executable
  #     evidence that WooCommerce order payloads survive retention compaction — reported a silent
  #     `# SKIP` inside this very job. It is set below now.
  #   * FOUR open a real connection whenever DATABASE_URL is set and skip themselves when it is not
  #     (`connection-schema-pinning`, `guarded-pool-routing`, `session-lock-affinity`,
  #     `startup-option-verdict-across-bundles`). They run here, against this job's database.
  #   * FOUR never open one (`advisory-lock-keys`, `pool-acquisition-bound`, `post-remote-persist`,
  #     `prisma-unique-violation`) and run identically under `test:unit`.
  #
  # The lesson is not "count the files again". It is that a prose census goes stale silently, so the
  # census is now a program: `scripts/check-db-test-gates.mjs`, run as a step of this job.
  #
  # WHY A SIBLING JOB AND NOT MORE STEPS ON `fresh-db-drift`. Both were available; the deciding
  # facts are about the DATABASE and about what a red job means.
  #
  #   1. THE DATABASES MUST NOT BE THE SAME ONE. `fresh-db-drift`'s database IS its subject: it is
  #      migrated and then compared against prisma/schema.prisma, and its later steps run the
  #      migrations' own verification queries over it. This suite CREATEs and DROPs scratch
  #      databases on the same server (the tr-TR locale probes) and writes into transactions on the
  #      main one. Sharing a service container would put a drift verdict downstream of a domain
  #      suite's cleanup — the drift check would still be about a freshly migrated database only for
  #      as long as that stayed true. A separate job gets a separate container and the question
  #      stays clean.
  #   2. A RED JOB SHOULD NAME ITS OWN SUBJECT. `fresh-db-drift` is already a five-link chain (drift
  #      -> migration verifications -> object access -> direct-address resolution -> concurrency).
  #      Appending a sixth means an accounting regression is reported as a schema guardrail, and it
  #      means this suite is reachable only after five other things pass — the mask that o3d-amy8
  #      was about, one workflow up.
  #   3. IT COSTS NO WALL-CLOCK. The jobs run in parallel, so the duplicated `npm ci` +
  #      `migrate deploy` is runner time and not time on the critical path.
  #
  # It is MODELLED ON `fresh-db-drift` and not on a new pattern: the same pinned action SHAs, the
  # same `postgres:16` service with the same health check, the same DATABASE_URL shape, the same
  # generate-then-deploy prelude. It deliberately does NOT take the DATABASE_SESSION_LOCK_URL
  # override that job needs — nothing here acquires a session advisory lock.
  #
  # NO `DATABASE_SESSION_LOCK_URL`, AND SUPERUSER ON PURPOSE. The locale half CREATEs a database, so
  # the connecting role needs CREATEDB and a route to the `postgres` maintenance database; the
  # service's `POSTGRES_USER: postgres` is a superuser and provides both.
  accounting-db-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ims_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ims_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ims_ci?schema=public
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # BEFORE the suites, because it is about whether they will actually run. It reads the env
      # assignments on `npm run test:db` and the `process.env` reads in tests/db/, and fails if a gate
      # there is not set here with a REQUIRE_ counterpart something reads. Codex r18 found
      # RUN_DB_RETENTION_TESTS gating a real database test that this job never set, so that test
      # reported `# SKIP` inside a green job; this is what stops the NEXT gate doing the same.
      - name: Census the tests/db gates against the script this job runs
        run: npm run check:db-test-gates
      - run: npx prisma generate --schema prisma/schema.prisma
      - run: npx prisma migrate deploy --schema prisma/schema.prisma
      # `test:db` sets RUN_DB_MIGRATION_TESTS=1 *and* REQUIRE_DB_MIGRATION_TESTS=1, and
      # RUN_DB_RETENTION_TESTS=1 *and* REQUIRE_DB_RETENTION_TESTS=1. The second of each pair is the
      # tripwire for this job: if an edit ever drops the first, the suites refuse to load instead of
      # skipping themselves into a green run again. The census step above is what keeps a THIRD gate
      # from arriving without either half.
      #
      # THE LOCALE HALF IS CONDITIONAL ON THE IMAGE AND SAYS SO. Four tests create a scratch database
      # with `LOCALE_PROVIDER icu ICU_LOCALE 'tr-TR'`. The `postgres:16` image installs PGDG
      # `postgresql-16`, whose control file carries a hard `Depends: libicu72`, so the server is
      # linked against ICU and initdb imports the system ICU collations; `tr-TR` is core CLDR and is
      # expected to be among them. That is package metadata, NOT a measurement on a runner. If it is
      # absent anyway the four tests skip and say so — on stderr, as a `::warning::` annotation and
      # in this job's summary — while the other eleven still run against the migrated database. What
      # is NOT tolerated is ICU being present without `tr-TR`: that is the probe being wrong, and the
      # suite fails rather than retiring its own evidence.
      - name: Run the DB-backed regression suites
        run: npm run test:db
