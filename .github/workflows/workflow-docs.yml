name: Workflow Docs

on:
  pull_request:
    paths:
      - ".github/workflows/workflow-docs.yml"
      - "docs/workflows.md"
      - "lib/domain/workflows/**"
      - "package-lock.json"
      - "package.json"
      - "scripts/generate-workflow-docs.ts"
  push:
    branches:
      - main
      - development
    paths:
      - ".github/workflows/workflow-docs.yml"
      - "docs/workflows.md"
      - "lib/domain/workflows/**"
      - "package-lock.json"
      - "package.json"
      - "scripts/generate-workflow-docs.ts"

jobs:
  generated-workflow-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run docs:workflows:check
